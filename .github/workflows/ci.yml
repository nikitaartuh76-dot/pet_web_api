name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/ASP_FINAL_PROJECT.csproj

      - name: Restore dependencies
        run: dotnet restore ASP_FINAL_PROJECT.slnx

      - name: Build
        run: dotnet build ASP_FINAL_PROJECT.slnx --no-restore --configuration Release
  docker-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name : Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max